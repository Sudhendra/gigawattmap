name: Refresh daily news
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run python -m pytest tests/test_news.py tests/test_releases.py
        env:
          PYTHONPATH: .
      - name: Refresh and publish
        run: uv run python -m opendc.refresh news
        env:
          PYTHONPATH: .
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: gigawattapp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-refresh-report
          path: data-pipeline/out/refresh-news/
          retention-days: 14
